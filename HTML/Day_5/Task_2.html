<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h2>Student Registration Form</h2>
    <div>
        <form>
            <label>Name</label>
            <input type="text" name="name" placeholder="Enter a Name" required><br><br>
            <label>Email</label>
            <input type="Email" placeholder="Enter a Email" required><br><br>
            <label>Password</label>
            <input type="Password" placeholder="Enter a Password" required><br><br>
            <label>Age</label>
            <input type="number" placeholder="Enter a Age" required><br><br>
            <label>Date Of Birth</label>
            <input type="datetime-local" ><br><br>
            <label>Gender</label>
            <input type="Radio" name="Gender">Male
            <input type="Radio" name="Gender">Female <br><br>
            <label for="">Course</label>
            <select>
                <option value="Full Stack">Full Stack</option>
                <option value="Python">Python</option>
                <option value="Java">Java</option>
                <option value="Data Science">Data Science</option>
            </select><br><br>
            <label for="">Skills</label>
            <input type="checkbox" name="Skills">Full Stack
            <input type="checkbox" name="Skills">Java
            <input type="checkbox" name="Skills">Python
            <input type="checkbox" name="Skills">Data Science <br><br>
            <label for="">Address</label>
            <textarea name="Address" id="" placeholder="Enter a Address"></textarea><br><br>
            <input type="submit" value="Submit Button">
            <input type="submit" value="Reset Button">

            
        </form>
    </div>
</body>
</html>
