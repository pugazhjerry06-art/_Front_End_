<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Classroom Details</title>

    <style>
        .title {
            color: white;
            background-color: blue;
        }

        .section {
            color: black;
            background-color: lightgray;
        }

        .section-title {
            color: darkblue;
            background-color: lightblue;
        }

        .teacher {
            color: darkgreen;
            background-color: lightgreen;
        }

        .student {
            color: darkred;
            background-color: mistyrose;
        }

        .topic {
            color: purple;
            background-color: lavender;
        }

        .status {
            color: white;
            background-color: green;
        }
    </style>
</head>

<body>

    <h1 class="title">CSS Class</h1>

    <div class="section">
        <h2 class="section-title">Teacher Information</h2>

        <p class="teacher">Teacher Name</p>
        <p class="teacher">Subject</p>
    </div>

    <div class="section">
        <h2 class="section-title">Student Information</h2>

        <p class="student">Arun</p>
        <p class="student">Priya</p>
        <p class="student">Kumar</p>
        <p class="student">Divya</p>
    </div>

    <div class="section">
        <h2 class="section-title">Today's Topics</h2>

        <p class="topic">HTML</p>
        <p class="topic">CSS</p>
        <p class="topic">JavaScript</p>
    </div>

    <div class="section">
        <h2 class="section-title">Class Status</h2>

        <p class="status">Class Started</p>
        <p class="status">Class In Progress</p>
        <p class="status">Class Completed</p>
    </div>

</body>
</html>
